name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check (astro check and tsc)
        run: pnpm check

      - name: Lint (Stylelint and Prettier)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit and build-verification tests
        run: pnpm test

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser tests (axe accessibility and smoke)
        id: e2e
        run: pnpm test:e2e

      # Only when a browser test fails, and only for a day: the report holds a
      # full-page screenshot per page and device, and every artifact counts
      # against the account's storage quota. Reproduce a failure locally with
      # `pnpm test:e2e`.
      - name: Upload the Playwright report (includes page screenshots)
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - name: Upload the site for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          # Keep dotfiles (a future .well-known/, for example): the deploy syncs
          # with --delete, so anything left out of the artifact would be removed
          # from the bucket.
          include-hidden-files: true
          # Only the deploy job in this run needs it.
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: validate
    # Skipped until the repository variable DEPLOY_ENABLED is "true". The role, bucket and
    # distribution are repository secrets, so this public repository's logs mask them.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      BUCKET: ${{ secrets.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # DEPLOY_ENABLED switches the job on; the region and the secrets must be set too.
      - name: Check the deploy settings are set
        env:
          REGION: ${{ vars.AWS_REGION }}
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          missing=()
          [ -n "$ROLE" ] || missing+=(AWS_ROLE_ARN)
          [ -n "$REGION" ] || missing+=(AWS_REGION)
          [ -n "$BUCKET" ] || missing+=(S3_BUCKET)
          [ -n "$DISTRIBUTION_ID" ] || missing+=(CLOUDFRONT_DISTRIBUTION_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Set these before deploying: ${missing[*]}. AWS_REGION is a repository variable; the others are repository secrets."
            exit 1
          fi

      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # The sync steps delete anything not in dist/, so stop before AWS if the
      # artifact isn't the built site (for example, an artifact action update
      # changed its layout). CloudFront's error pages need 404.html.
      - name: Check the downloaded site
        run: |
          for f in dist/index.html dist/404.html; do
            [ -f "$f" ] || { echo "::error::$f is missing from the site artifact, so nothing was deployed."; exit 1; }
          done
          [ -d dist/_astro ] || { echo "::error::dist/_astro/ is missing from the site artifact, so nothing was deployed."; exit 1; }

      # Short-lived credentials via OpenID Connect: no AWS keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: carpe-tempus-${{ github.run_id }}

      - name: Upload fingerprinted assets (cached for a year)
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --exclude "*" --include "*.woff2" \
            --content-type font/woff2 --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --exclude "*.woff2" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors

      # Pages removed from the build are deleted here, before the invalidation, on
      # purpose. Edges keep pages until the next invalidation (s-maxage), so a page
      # deleted after it could be fetched again and stay live until the next deploy.
      # --no-progress lists every upload and deletion in the log.
      - name: Upload pages and other files (browsers revalidate on every visit)
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate" --no-progress

      - name: Invalidate CloudFront and wait
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      # Only after the invalidation, so no cached page can point at a deleted stylesheet.
      - name: Remove superseded assets
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete --exclude "*" --include "*.woff2" \
            --content-type font/woff2 --cache-control "public, max-age=31536000, immutable" --no-progress
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete --exclude "*.woff2" \
            --cache-control "public, max-age=31536000, immutable" --no-progress

      - name: Smoke-test the live site
        if: env.SITE_URL != ''
        run: |
          curl -fsSI "$SITE_URL/" | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/about")" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/this-page-does-not-exist/")" = 404
          # A crafted path must redirect within the site, never to another host (open redirect).
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$SITE_URL//example.com/x")" = "$SITE_URL/example.com/x/"
          # The upload steps' Cache-Control headers reach visitors: pages revalidate,
          # fingerprinted assets are kept for a year.
          curl -fsSI "$SITE_URL/" | grep -qi '^cache-control:.*must-revalidate'
          asset=$(curl -fsS "$SITE_URL/" | grep -o '/_astro/[^"]*\.css' | head -n 1)
          test -n "$asset"
          curl -fsSI "$SITE_URL$asset" | grep -qi '^cache-control:.*immutable'
